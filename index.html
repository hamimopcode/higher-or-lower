<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher or Lower - Guessing Game</title>

    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <h1 class="page-heading">Higher or Lower</h1>
    <h2 class="page-subheading">Guess the number!</h2>
    <p class="js-computer-answer-el"></p>
    <input type="number" class="js-user-input">
    <button class="check-user-guess-btn">Check</button>
    <button class="js-new-game-btn">New Game</button>
    <button class="js-reset-game-btn">Reset Game</button>
    <p class="js-computer-message-el"></p>
    <p class="js-attempts-el"></p>
    <p class="js-times-played-el"></p>
    <p class="js-best-score-el"></p>
    <button class="js-clear-score-btn">Clear Score</button>

    <script src="js/main.js"></script>
</body>
</html>
