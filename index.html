<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher or Lower - Guessing Game</title>

    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="heading-div">
            <h1 class="page-heading-el">Higher or Lower</h1>
            <h2 class="page-subheading-el">Guess the number!</h2>
        </div>
    </header>

    <main>
        <div class="main-div">
            <div class="computer-response-div">
                <p class="computer-message-el js-computer-message-el">Enter a valid number</p>
                <p class="computer-answer-el js-computer-answer-el">HIGHER</p>
            </div>
            <div class="stats-div">
                <p class="attempts-el js-attempts-el">Attempts: 0</p>
                <p class="times-played-el js-times-played-el">Times Playes: 0</p>
                <p class="best-score-el js-best-score-el">Best Score: 0</p>
                <button class="clear-score-btn js-clear-score-btn">Clear Score</button>
            </div>
            <div class="input-div">
                <input type="number" class="user-input js-user-input">
                <button class="check-user-guess-btn js-check-user-guess-btn">Check</button>
            </div>
            <div class="start-game-div">
                <button class="new-game-btn js-new-game-btn">New Game</button>
                <button class="reset-game-btn js-reset-game-btn">Reset Game</button>
            </div>
        </div>
    </main>

    <footer>
        <p class="copyright-el">&copy; hamimopcode | 2026</p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
